<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TruthLens</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">TruthLens<span>✦</span></div>
  <p class="subtitle">Understand what you agree to.</p>
  <div class="page" id="pageInfo">Ready to analyze this webpage</div>
</header>
<main>
  <label for="category">1. Select Category</label>
  <select id="category">
    <option>Privacy Policy</option>
    <option>Terms &amp; Conditions</option>
    <option>Refund &amp; Return Policy</option>
    <option>Cancellation Policy</option>
    <option>Subscription Policy</option>
    <option>Shipping &amp; Delivery Policy</option>
    <option>Payment Policy</option>
    <option>User Agreement</option>
    <option>Cookie Policy</option>
    <option>Data Protection Policy</option>
  </select>

  <label for="language">2. Select Language</label>
  <select id="language">
    <option>English</option><option>Telugu</option><option>Hindi</option>
    <option>Tamil</option><option>Kannada</option><option>Malayalam</option>
  </select>

  <label for="analysisType">3. Select Analysis Type</label>
  <select id="analysisType">
    <option>Simple summary</option>
    <option>Clause-by-clause analysis</option>
    <option>Hidden charges analysis</option>
  </select>

  <label for="manualText">4. Enter Text (Optional)</label>
  <textarea id="manualText" placeholder="Paste the policy or terms here. Leave blank to analyze the current webpage."></textarea>

  <div class="backend-note"><b>Gemini connection:</b> Local backend at <code>http://localhost:3000</code></div>

  <button id="analyzeBtn" class="primary">Analyze with Gemini</button>
  <div id="status" role="status"></div>
  <section id="resultSection" hidden>
    <div class="result-heading"><span>▤</span><h2>Analysis Result</h2><b>✓</b></div>
    <div id="result" class="result"></div>
    <div class="result-actions">
      <button id="copyResult" class="secondary">Copy result</button>
      <button id="downloadResult" class="secondary">Download .txt</button>
    </div>
  </section>
  <p class="disclaimer">TruthLens is an AI-assisted reading tool, not legal advice. Verify important terms with the original document.</p>
</main>
<script src="popup.js"></script>
</body>
</html>
